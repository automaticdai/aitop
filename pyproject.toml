[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitop"
version = "1.1.0"
description = "Terminal and web dashboard for AI coding assistant usage quotas"
authors = [{name = "automaticdai"}]
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60.0",
    "httpx>=0.27.0",
    "pyte>=0.8.0",
    # starlette <1 keeps the httpx-based TestClient (1.x deprecates it for httpx2).
    "starlette>=0.36,<1",
    "uvicorn>=0.27",
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aitop = "aitop.cli:main"

[project.urls]
Repository = "https://github.com/automaticdai/aitop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aitop = ["static/*.svg", "static/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
