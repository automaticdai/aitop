[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pal"
version = "0.1.0"
description = "TUI dashboard for AI coding assistant usage limits"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60.0",
    "httpx>=0.27.0",
    "pexpect>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-pal = "ai_pal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
