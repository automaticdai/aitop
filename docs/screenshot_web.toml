# Demo configuration for the README web screenshot.
# Run: aitop --headless --mock --config docs/screenshot_web.toml
refresh_interval_s = 30
show_remaining = true
reset_countdown = true # Sessions: yh zm; other windows: xd yh zm.

[layout]
adaptive = true

[web]
enabled = true
host = "127.0.0.1"
port = 8788
show_claude_gpt = true
show_remaining = true
reset_countdown = true
provider_order = ["claude", "codex", "gemini", "deepseek"]

[web.layout]
mode = "custom"
rows = 2
columns = 2
